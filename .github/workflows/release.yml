name: Release

on:
  push:
    tags: ["v*"]
  # Builds the Python and WASM packages from the selected ref. Uploads only
  # when `publish` is set: a PyPI version can never be re-uploaded, so a
  # first release is inspected before it goes out.
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to PyPI and npm
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The tag is the release's identity; a manifest that disagrees with it
      # produced PAN-134, where two tagged versions were never published.
      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "volsurf"))')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "tag $tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

      # A version can reach crates.io before its tag does — 2.4.0 was published
      # by hand. Re-publishing is a hard error, so the tag has to be a no-op.
      - name: Check whether the version is already published
        id: crates_io
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          http_status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "User-Agent: volsurf-release" \
            "https://crates.io/api/v1/crates/volsurf/$VERSION")
          case "$http_status" in
            200) published=true ;;
            404) published=false ;;
            *)
              echo "failed to check volsurf $VERSION on crates.io: HTTP $http_status" >&2
              exit 1
              ;;
          esac
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "volsurf $VERSION already on crates.io: $published" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: steps.crates_io.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The Python and WASM packages ship under the crate's version, so all three
  # manifests have to agree with each other and, on a tag, with the tag.
  versions:
    name: Check package versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys, tomllib
          def load(path):
              with open(path, "rb") as f:
                  return tomllib.load(f)
          versions = {
              "Cargo.toml": load("Cargo.toml")["package"]["version"],
              "python/pyproject.toml": load("python/pyproject.toml")["project"]["version"],
              "wasm/Cargo.toml": load("wasm/Cargo.toml")["package"]["version"],
          }
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              versions["tag"] = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if len(set(versions.values())) != 1:
              sys.exit(f"package versions disagree: {versions}")
          print(f"version={versions['Cargo.toml']}")
          PY

  wheels:
    name: Wheels (${{ matrix.runner }}, ${{ matrix.target }})
    needs: versions
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      # The bindings are not abi3, so every supported Python needs its own
      # wheel. macOS and Windows see only the interpreters installed here.
      # The manylinux image also ships pre-release, free-threaded and PyPy
      # interpreters CI never tests, so Linux names the five it builds for.
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist -m python/Cargo.toml ${{ runner.os == 'Linux' && '-i python3.10 python3.11 python3.12 python3.13 python3.14' || '--find-interpreter' }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls dist >> "$GITHUB_STEP_SUMMARY"
      # Trusted publishing: PyPI accepts this repository's OIDC token for
      # release.yml in the `pypi` environment, so no API token is stored.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    name: Publish to npm
    needs: versions
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: wasm-pack build wasm/ --target web --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm pack --dry-run ./wasm/pkg
      - name: Check whether the version is already published
        id: npm
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          if npm view "volsurf-wasm@$VERSION" version >/dev/null 2>&1; then
            published=true
          else
            published=false
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "volsurf-wasm $VERSION already on npm: $published" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: steps.npm.outputs.published == 'false' && (github.event_name == 'push' || inputs.publish)
        run: npm publish ./wasm/pkg --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
