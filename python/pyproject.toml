[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "volsurf"
version = "4.0.1"
description = "Python bindings for volsurf, a volatility surface library for equity and FX derivatives"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/volsurf-rs/volsurf"
Changelog = "https://github.com/volsurf-rs/volsurf/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=9.0.3"]

[tool.maturin]
features = ["pyo3/extension-module"]
