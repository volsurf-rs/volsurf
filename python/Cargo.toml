[package]
name = "volsurf-python"
version = "3.0.0"
edition = "2024"
publish = false

[lib]
name = "volsurf"
crate-type = ["cdylib"]
doc = false

[dependencies]
volsurf = { path = ".." }
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods"] }
numpy = "0.29"
serde_json = "1.0"
